name: Publish to npm

on:
  push:
    branches: [main, dev]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Generated-file drift
        run: npm run check:generated

      - name: Documentation examples
        run: npm run check:docs-examples

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, SSR, axe, and coverage thresholds
        run: npm run test:coverage

      - name: Build package
        run: npm run build

      - name: Bundle size budgets
        run: npm run check:size

      - name: Consumer entry and editor types
        run: npm run test:consumer

      - name: Build documentation
        run: npm run docs:build

      - name: Install Playwright browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser interaction tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ runner.os }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Pack and release metadata audit
        run: node scripts/check-release.mjs --skip-registry

      - name: Runtime dependency audit
        run: npm audit --omit=dev

      # main：发布正式版（dist-tag = latest）。
      # 当前 package.json 版本若已存在于 npm 则跳过，避免重复发布报错。
      - name: Publish release (main)
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "mcui-oreui@$VERSION" version > /dev/null 2>&1; then
            echo "mcui-oreui@$VERSION 已存在于 npm，跳过发布。请先 bump 版本号。"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MCUIACTION }}

      # dev：发布预发布测试版（dist-tag = next）。
      # 版本号在 base 上附加 -dev.<run_number>，每次推送产出唯一可安装版本。
      - name: Publish prerelease (dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          BASE=$(node -p "require('./package.json').version")
          PRE="${BASE%%-*}-dev.${{ github.run_number }}"
          echo "发布测试版 mcui-oreui@$PRE (tag: next)"
          npm version "$PRE" --no-git-tag-version
          npm run generate
          npm publish --tag next --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MCUIACTION }}
